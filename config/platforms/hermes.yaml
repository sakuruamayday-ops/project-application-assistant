schema_version: 1
platform: hermes
display_name: Hermes Agent

discovery:
  user_skills_install_dir: "${HOME}/.hermes/skills"
  bundled_skills_dir: "${HOME}/.hermes/hermes-agent/skills"
  project_instructions_file: .hermes.md
  install_mode: user_skills_only

capabilities:
  gateway: native
  memory: native_or_user_provider
  curator: native
  skill_management: native
  mcp: native
  browser: user_configured
  documents: official_or_user_installed_skill
  external_channels:
    feishu: native_gateway_or_user_adapter

skills:
  source_dir: "${PROJECT_ASSISTANT_SKILLS_DIR}"
  enabled_bundle: full
  install_to_bundled_skills_dir: false
  install_generic_document_skills: false

evolution:
  use_native_curator: true
  curator_mode: report_only
  allow_skill_mutation: false
  allow_skill_archive: false
  require_human_approval: true
  snapshot_before_change: true

providers:
  inherit_common_config: true
  use_user_mcp_config: true
  write_native_mcp_config: false

guardrails:
  never_modify_hermes_bundled_skills: true
  require_confirmation_before_archive: true
  require_confirmation_before_external_send: true

health_checks:
  - hermes_version
  - user_skill_discovery
  - gateway_status
  - feishu_status
  - mcp_connectivity
  - curator_status
  - obsidian_path
  - provider_connectivity

