schema_version: 1
platform: claude-code
display_name: Claude Code

discovery:
  skills_install_dir: "${HOME}/.claude/skills"
  project_instructions_file: CLAUDE.md
  install_mode: copy_or_symlink

capabilities:
  code_agent: native
  project_context: native
  mcp: native
  browser: user_configured_mcp
  documents: official_or_user_installed_skill
  spreadsheets: official_or_user_installed_skill
  presentations: official_or_user_installed_skill
  pdf: official_or_user_installed_skill
  external_channels:
    feishu: via_hermes_adapter

skills:
  source_dir: "${PROJECT_ASSISTANT_SKILLS_DIR}"
  enabled_bundle: full
  install_generic_document_skills: false

providers:
  inherit_common_config: true
  use_user_mcp_config: true
  write_native_mcp_config: false

guardrails:
  do_not_copy_restricted_anthropic_skills: true
  require_confirmation_before_archive: true
  require_confirmation_before_external_send: true
  evolution_default_mode: dry_run

health_checks:
  - skill_discovery
  - mcp_connectivity
  - browser_availability
  - document_capabilities
  - obsidian_path
  - provider_connectivity

