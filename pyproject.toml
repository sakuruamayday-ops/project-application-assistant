[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-application-assistant"
version = "3.0.0"
description = "面向政府项目申报工程师的 V3 十大核心技能包与统一确定性引擎"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyMuPDF>=1.24,<2",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.scripts]
project-assistant = "project_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "skills"]
