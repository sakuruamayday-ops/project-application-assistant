[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-application-assistant"
version = "1.3.1.1"
description = "面向政府项目申报工程师的技能包与本地配置工具"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "python-docx>=1.1",
]

[project.scripts]
project-assistant = "project_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
