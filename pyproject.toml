[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-application-assistant"
version = "1.6.4.1"
description = "面向政府项目申报工程师的技能包与本地配置工具"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyMuPDF>=1.24,<2",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.scripts]
project-assistant = "project_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
