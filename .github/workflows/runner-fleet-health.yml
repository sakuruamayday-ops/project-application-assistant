name: WorkBuddy runner fleet health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  runner-health:
    runs-on: [self-hosted, workbuddy, macos]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Require one online macOS and Windows WorkBuddy runner
        shell: bash
        run: python3 scripts/check_runner_fleet.py
