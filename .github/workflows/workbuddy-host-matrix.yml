name: WorkBuddy real-host release gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub prerelease tag to verify
        required: true
        type: string
  release:
    types: [prereleased]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: workbuddy-real-host-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  real-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos
            runs_on: '["self-hosted","workbuddy","macos"]'
            python: python3
            shell: bash
          - host: windows
            runs_on: '["self-hosted","workbuddy","windows"]'
            python: python
            shell: pwsh
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      GH_TOKEN: ${{ github.token }}
      JIAOTANG_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Verify release-host prerequisites
        shell: ${{ matrix.shell }}
        run: |
          ${{ matrix.python }} --version
          gh --version

      - name: Run real marketplace add-install-enable-trigger gate
        shell: ${{ matrix.shell }}
        run: |
          ${{ matrix.python }} scripts/run_workbuddy_release_gate.py --release-tag "${{ github.event.release.tag_name || inputs.release_tag }}" --repository "${{ github.repository }}" --host "${{ matrix.host }}" --output-dir "artifacts/workbuddy-${{ matrix.host }}"

      - name: Sign host evidence with GitHub OIDC
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/workbuddy-${{ matrix.host }}/host-evidence.json

      - name: Record attestation locator
        shell: ${{ matrix.shell }}
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          ${{ matrix.python }} scripts/write_attestation_locator.py --output-dir "artifacts/workbuddy-${{ matrix.host }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbuddy-${{ matrix.host }}-evidence
          path: artifacts/workbuddy-${{ matrix.host }}
          if-no-files-found: error
