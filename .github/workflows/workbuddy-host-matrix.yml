name: WorkBuddy real-host release gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub prerelease tag to verify
        required: true
        type: string
  release:
    types: [prereleased]

permissions:
  contents: read

concurrency:
  group: workbuddy-real-host-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  real-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos
            runs_on: '["self-hosted","workbuddy","macos"]'
          - host: windows
            runs_on: '["self-hosted","workbuddy","windows"]'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      GH_TOKEN: ${{ github.token }}
      JIAOTANG_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Verify release-host prerequisites
        shell: python
        run: |
          import os
          import platform
          import shutil
          expected = "${{ matrix.host }}"
          actual = "macos" if platform.system() == "Darwin" else platform.system().lower()
          if actual != expected:
              raise SystemExit(f"Runner label says {expected}, actual OS is {actual}")
          if not shutil.which("gh"):
              raise SystemExit("GitHub CLI is required on the release host")
          print({"host": actual, "python": platform.python_version(), "runner": os.environ.get("RUNNER_NAME", "")})

      - name: Run real marketplace add-install-enable-trigger gate
        shell: python
        run: |
          import subprocess
          subprocess.run(
              [
                  "python",
                  "scripts/run_workbuddy_release_gate.py",
                  "--release-tag",
                  "${{ github.event.release.tag_name || inputs.release_tag }}",
                  "--repository",
                  "${{ github.repository }}",
                  "--host",
                  "${{ matrix.host }}",
                  "--output-dir",
                  "artifacts/workbuddy-${{ matrix.host }}",
              ],
              check=True,
          )

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbuddy-${{ matrix.host }}-evidence
          path: artifacts/workbuddy-${{ matrix.host }}
          if-no-files-found: error
