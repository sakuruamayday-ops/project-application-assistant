name: Website package distribution gates

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "services/knowledge-portal/**"
      - "skills/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "docs/product/**"
      - "docs/releases/**"
      - "pyproject.toml"
      - ".github/workflows/skills-manager-release-gates.yml"
  pull_request:
    paths:
      - "services/knowledge-portal/**"
      - "skills/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "docs/product/**"
      - "docs/releases/**"
      - "pyproject.toml"
      - ".github/workflows/skills-manager-release-gates.yml"
  workflow_dispatch:

concurrency:
  group: package-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-center:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify dependency locks
        run: >-
          python services/knowledge-portal/scripts/python_supply_chain.py
          lock-metadata-verify
          --portal-dir services/knowledge-portal
      - name: Build production wheelhouse
        run: >-
          python services/knowledge-portal/scripts/python_supply_chain.py build
          --lock services/knowledge-portal/requirements.lock
          --build-lock services/knowledge-portal/requirements-build.lock
          --wheelhouse "${RUNNER_TEMP}/portal-production-wheelhouse"
      - name: Build test wheelhouse
        run: >-
          python services/knowledge-portal/scripts/python_supply_chain.py build
          --lock services/knowledge-portal/requirements-test.lock
          --build-lock services/knowledge-portal/requirements-build.lock
          --wheelhouse "${RUNNER_TEMP}/portal-test-wheelhouse"
      - name: Install test dependencies offline
        shell: bash
        run: |
          manifest_sha256="$(
            cut -d' ' -f1 \
              "${RUNNER_TEMP}/portal-test-wheelhouse/wheelhouse-manifest.sha256"
          )"
          python services/knowledge-portal/scripts/python_supply_chain.py install \
            --lock services/knowledge-portal/requirements-test.lock \
            --build-lock services/knowledge-portal/requirements-build.lock \
            --wheelhouse "${RUNNER_TEMP}/portal-test-wheelhouse" \
            --expected-manifest-sha256 "${manifest_sha256}"
      - run: python -m pytest -q tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -m pytest -q
        working-directory: services/knowledge-portal
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: node --check services/knowledge-portal/static/skills-manager/sw.js
      - run: node services/knowledge-portal/scripts/check_website_package_center.mjs
      - name: Record production dependency identity
        env:
          DEPENDENCY_IDENTITY_PATH: ${{ runner.temp }}/portal-production-dependency-identity.json
          DEPENDENCY_RELEASE_RECORD_PATH: ${{ runner.temp }}/portal-production-dependency-release-record.json
        shell: bash
        run: |
          manifest_sha256="$(
            cut -d' ' -f1 \
              "${RUNNER_TEMP}/portal-production-wheelhouse/wheelhouse-manifest.sha256"
          )"
          python services/knowledge-portal/scripts/python_supply_chain.py verify \
            --lock services/knowledge-portal/requirements.lock \
            --build-lock services/knowledge-portal/requirements-build.lock \
            --wheelhouse "${RUNNER_TEMP}/portal-production-wheelhouse" \
            --expected-manifest-sha256 "${manifest_sha256}" \
            --identity-output "${DEPENDENCY_IDENTITY_PATH}"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          identity_path = Path(os.environ["DEPENDENCY_IDENTITY_PATH"])
          record_path = Path(os.environ["DEPENDENCY_RELEASE_RECORD_PATH"])
          identity = json.loads(identity_path.read_text(encoding="utf-8"))
          record = {
              "schema_version": 1,
              "artifact_type": "jiaotang-python-dependency-release-record",
              "source_commit": os.environ["GITHUB_SHA"],
              "source_event": os.environ["GITHUB_EVENT_NAME"],
              "source_ref": os.environ["GITHUB_REF"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "dependency_identity": identity,
          }
          payload = (
              json.dumps(
                  record,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n"
          ).encode("utf-8")
          record_path.write_bytes(payload)
          record_sha256 = hashlib.sha256(payload).hexdigest()
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a",
              encoding="utf-8",
          ) as summary:
              summary.write(
                  "### Production dependency identity\n\n"
                  f"- source commit: `{record['source_commit']}`\n"
                  f"- source event: `{record['source_event']}`\n"
                  f"- wheelhouse manifest: "
                  f"`{identity['wheelhouse_manifest_sha256']}`\n"
                  f"- dependency identity: "
                  f"`{identity['dependency_identity_sha256']}`\n"
                  f"- release record: `{record_sha256}`\n"
              )
          PY
      - name: Upload production wheelhouse
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-python312-linux-x86_64-wheelhouse
          path: |
            ${{ runner.temp }}/portal-production-wheelhouse
            ${{ runner.temp }}/portal-production-dependency-release-record.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  workbuddy-connector:
    name: WorkBuddy connector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node tests/workbuddy_connector_contract.mjs
