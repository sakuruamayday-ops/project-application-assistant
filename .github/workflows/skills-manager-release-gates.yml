name: Website package distribution gates

on:
  pull_request:
    paths:
      - "services/knowledge-portal/**"
      - "scripts/controlled_release.py"
      - "tests/test_controlled_release.py"
      - "skills/_runtime/jiaotang-kb/jiaotang-agent.mjs"
      - "tests/workbuddy_connector_contract.mjs"
      - "docs/product/website-package-distribution.md"
      - "docs/releases/website-package-center-2026-07-28.md"
      - ".github/workflows/skills-manager-release-gates.yml"
  workflow_dispatch:

jobs:
  package-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r services/knowledge-portal/requirements.txt pytest
      - run: node --check services/knowledge-portal/static/skills-manager/sw.js
      - run: node services/knowledge-portal/scripts/check_website_package_center.mjs
      - run: >-
          python -m pytest -q tests/test_portal.py
          -k "legacy_client_artifacts_do_not_feed_unified_workbuddy_channel or skills_manager_retirement"
        working-directory: services/knowledge-portal
      - run: >-
          python -m pytest -q
          tests/test_publish_skill_release.py
          tests/test_release_transaction.py
        working-directory: services/knowledge-portal
      - run: python -m pytest -q tests/test_controlled_release.py

  workbuddy-connector:
    name: WorkBuddy connector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/workbuddy_connector_contract.mjs
